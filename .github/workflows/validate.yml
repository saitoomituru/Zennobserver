name: Zenn記事の検証

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenn-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Zennobserverだけを取得
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: 固定した依存を再構築
        run: npm ci
      - name: 検証器と記事メタ情報を確認
        run: npm run check
