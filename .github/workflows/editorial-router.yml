name: JSON-LD素材の配置

on:
  push:
    branches: [main]
    paths:
      - 'INBOX/**'
      - 'BACKNUMBERS/**'
      - 'OUTLINES/**'
      - 'articles/**'
      - 'config/editorial-router.json'
      - 'scripts/editorial_router.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-router-main
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[editorial-router]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: mainの完全な履歴を取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: JSON-LDを検証して配置と索引を構築
        run: python3 scripts/editorial_router.py build
      - name: routerの回帰試験と索引整合を確認
        run: |
          python3 -m unittest discover -s tests -p 'test_router.py' -v
          python3 scripts/editorial_router.py reindex --check
      - name: 機械生成した配置だけを反映
        run: |
          git config user.name 'Zennobserver Router'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- INBOX BACKNUMBERS OUTLINES
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[meta] router: JSON-LDタグに従って素材を整理 [editorial-router]'
          git push origin HEAD:main
